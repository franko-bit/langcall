<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Free4Talk — Live Language Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-base: #0c0c0c;
      --bg-surface: #121212;
      --bg-elevated: #1a1a1a;
      --bg-card: #1f1f1f;
      --border-subtle: #2c2c2c;
      --border-medium: #3a3a3a;
      --text-primary: #f0f0ea;
      --text-secondary: #c0c0b8;
      --text-muted: #8a8a82;
      --accent-lime: #c8f04a;
      --accent-lime-dark: #8cb52a;
      --accent-lime-bg: #1e2a0c;
      --blue-accent: #4a9eff;
      --orange-accent: #f5a623;
      --red-accent: #ff5a5a;
    }

    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      scroll-behavior: smooth;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    /* Header */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 68px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-dot {
      width: 12px;
      height: 12px;
      background: var(--accent-lime);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-lime);
      animation: softPulse 2s infinite;
    }
    @keyframes softPulse {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }
    .logo-text {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.1em;
      color: var(--text-primary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }
    .live-badge {
      background: rgba(192, 240, 58, 0.12);
      border: 0.5px solid var(--accent-lime-dark);
      padding: 6px 14px;
      border-radius: 40px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      color: var(--accent-lime);
    }
    .btn {
      border-radius: 10px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s ease;
      cursor: pointer;
      border: 1px solid transparent;
      font-family: inherit;
    }
    .btn-primary-lime {
      background: var(--accent-lime);
      color: #0a0a0a;
      border-color: var(--accent-lime);
    }
    .btn-primary-lime:hover {
      background: #dcff6a;
      transform: scale(0.98);
    }
    .btn-outline {
      background: transparent;
      border-color: var(--border-medium);
      color: var(--text-secondary);
    }
    .btn-outline:hover {
      border-color: #6a6a62;
      background: rgba(255,255,240,0.03);
    }
    .text-link-light {
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
    }

    /* Hero */
    .hero-section {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 44px 32px;
    }
    .eyebrow-mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--accent-lime-dark);
      margin-bottom: 16px;
    }
    .hero-section h1 {
      font-size: 34px;
      font-weight: 700;
      max-width: 680px;
      line-height: 1.35;
    }

    /* Main */
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 32px 70px;
    }

    /* Search */
    .search-toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 32px;
    }
    .search-wrapper {
      flex: 2;
      min-width: 280px;
      display: flex;
      align-items: center;
      background: var(--bg-elevated);
      border: 1px solid var(--border-medium);
      border-radius: 56px;
      padding: 0 20px;
    }
    .search-wrapper:focus-within {
      border-color: var(--accent-lime);
    }
    .search-icon {
      font-size: 16px;
      color: var(--text-muted);
      margin-right: 12px;
    }
    .search-wrapper input {
      background: transparent;
      border: none;
      padding: 14px 0;
      flex: 1;
      font-size: 15px;
      outline: none;
      color: var(--text-primary);
    }
    .speed-group {
      display: flex;
      gap: 8px;
      background: var(--bg-elevated);
      border-radius: 48px;
      padding: 5px;
      border: 0.5px solid var(--border-subtle);
    }
    .speed-chip {
      background: transparent;
      border: none;
      padding: 8px 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      border-radius: 32px;
      cursor: pointer;
    }
    .speed-chip.active-speed {
      background: var(--accent-lime-bg);
      color: var(--accent-lime);
      border: 0.5px solid var(--accent-lime-dark);
    }

    /* Filters */
    .filter-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .filter-chips {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .level-chip {
      background: var(--bg-card);
      border: 0.5px solid var(--border-medium);
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .level-chip.active-level {
      background: var(--accent-lime-bg);
      border-color: var(--accent-lime-dark);
      color: var(--accent-lime);
    }
    .expand-chip {
      background: var(--bg-elevated);
      border: 0.5px solid var(--border-medium);
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: default;
    }

    /* Room grid */
    .room-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
      margin-top: 16px;
    }
    .room-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 22px;
      transition: all 0.18s ease;
      cursor: pointer;
    }
    .room-card:hover {
      border-color: #5a5a52;
      background: #262626;
      transform: translateY(-3px);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }
    .room-title {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.2px;
      line-height: 1.35;
    }
    .level-tag {
      background: var(--accent-lime-bg);
      border-radius: 30px;
      padding: 5px 12px;
      font-size: 11px;
      font-family: monospace;
      font-weight: 600;
      color: var(--accent-lime);
    }
    .function-text {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 18px;
      border-left: 3px solid var(--accent-lime-dark);
      padding-left: 12px;
    }

    /* Circular avatar styles */
    .participants-avatars {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0 16px;
      align-items: center;
    }
    .avatar-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #2a5f3a, #1a3a2a);
      color: white;
      position: relative;
      cursor: default;
      transition: transform 0.1s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }
    .avatar-wrapper {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
    }
    .participant-name-tooltip {
      font-size: 10px;
      margin-top: 4px;
      color: var(--text-muted);
      text-align: center;
      max-width: 60px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .avatar-remove-btn {
      position: absolute;
      bottom: -6px;
      right: -8px;
      width: 18px;
      height: 18px;
      background: var(--red-accent);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.1s;
      z-index: 5;
    }
    .avatar-wrapper:hover .avatar-remove-btn {
      opacity: 1;
    }
    .avatar-remove-btn:hover {
      background: #ff3333;
      transform: scale(1.05);
    }

    .room-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
    }
    .counter {
      font-size: 12px;
      font-family: monospace;
      font-weight: 500;
      color: #a0a098;
    }
    .join-mini {
      background: var(--accent-lime);
      border: none;
      padding: 8px 18px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      color: #0a0a0a;
    }
    .join-mini:hover {
      background: #e0ff70;
    }

    .empty-grid {
      grid-column: 1 / -1;
      text-align: center;
      padding: 90px 20px;
      color: var(--text-muted);
      font-family: monospace;
      font-size: 15px;
      background: var(--bg-surface);
      border-radius: 32px;
      border: 1px dashed var(--border-medium);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-panel {
      background: var(--bg-elevated);
      border: 1px solid var(--border-medium);
      border-radius: 32px;
      width: 90%;
      max-width: 480px;
      padding: 32px 34px;
    }
    .modal-panel h3 {
      font-size: 16px;
      font-family: monospace;
      font-weight: 600;
      color: var(--accent-lime);
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .modal-room-preview {
      background: var(--bg-card);
      padding: 14px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 15px;
      margin: 14px 0 20px;
    }
    label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 14px;
      display: block;
    }
    input, select {
      width: 100%;
      background: var(--bg-base);
      border: 1px solid var(--border-medium);
      border-radius: 14px;
      padding: 12px 16px;
      color: var(--text-primary);
      font-size: 15px;
      margin-top: 6px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--accent-lime);
    }
    .error-msg {
      color: #ff8888;
      font-size: 11px;
      margin-top: 6px;
      font-family: monospace;
    }
    .modal-actions {
      display: flex;
      gap: 16px;
      margin-top: 28px;
    }
    .toast-msg {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent-lime);
      color: #0a0a0a;
      padding: 12px 28px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 14px;
      z-index: 1100;
      transition: opacity 0.2s;
      font-family: monospace;
      pointer-events: none;
      white-space: nowrap;
    }
    @media (max-width: 550px) {
      .toast-msg { white-space: normal; text-align: center; font-size: 12px; max-width: 85vw; }
      .hero-section h1 { font-size: 26px; }
      .avatar-circle { width: 38px; height: 38px; font-size: 13px; }
    }
  </style>
</head>
<body>

<div class="top-bar">
  <div class="logo-area">
    <div class="logo-dot"></div>
    <div class="logo-text">FREE4TALK</div>
  </div>
  <div class="header-actions">
    <div class="live-badge" id="liveBadge">● LIVE · 0 rooms</div>
    <button class="btn btn-primary-lime" id="createRoomBtn">+ New group</button>
    <button class="btn btn-outline">☕ Support</button>
    <a href="#" class="text-link-light">Privacy</a>
    <a href="#" class="text-link-light">Discord</a>
  </div>
</div>

<section class="hero-section">
  <div class="eyebrow-mono">Language Practice Community</div>
  <h1>Talk, practice, and grow with live conversation groups.</h1>
</section>

<main class="main-container">
  <div class="search-toolbar">
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search by topic, function, or username..." />
    </div>
    <div class="speed-group">
      <button class="speed-chip active-speed" data-speed="3x">3x</button>
      <button class="speed-chip" data-speed="2x">2x</button>
      <button class="speed-chip" data-speed="1x">1x</button>
    </div>
  </div>

  <div class="filter-section">
    <div class="filter-chips" id="levelFilterContainer">
      <button class="level-chip active-level" data-filter="all">All levels</button>
      <button class="level-chip" data-filter="A">A1–A2 Beginner</button>
      <button class="level-chip" data-filter="B">B1–B2 Intermediate</button>
      <button class="level-chip" data-filter="C">C1–C2 Advanced</button>
    </div>
    <div class="expand-chip">⤢ Expand</div>
  </div>

  <div id="roomsGrid" class="room-grid"></div>
</main>

<div id="createModal" class="modal-overlay" style="display: none;">
  <div class="modal-panel">
    <h3>✚ New learning room</h3>
    <label>Topic / scenario (max 40 chars)</label>
    <input type="text" id="newScenario" placeholder="e.g. Weekend travel" maxlength="40" />
    <div id="topicError" class="error-msg"></div>
    <label>CEFR Level</label>
    <select id="newLevel">
      <option value="A1">A1 - Beginner</option><option value="A2">A2 - Elementary</option>
      <option value="B1" selected>B1 - Intermediate</option><option value="B2">B2 - Upper</option>
      <option value="C1">C1 - Advanced</option><option value="C2">C2 - Proficient</option>
    </select>
    <label>Language function</label>
    <input type="text" id="newFunction" placeholder="e.g. persuading, narrating" maxlength="50" />
    <div class="modal-actions">
      <button class="btn btn-primary-lime" id="confirmCreate">Create Room</button>
      <button class="btn btn-outline" id="cancelCreateModal">Cancel</button>
    </div>
  </div>
</div>

<div id="joinModal" class="modal-overlay" style="display: none;">
  <div class="modal-panel">
    <h3>🚪 Join room</h3>
    <div class="modal-room-preview" id="joinRoomPreview"></div>
    <label>Your role</label>
    <select id="joinRoleSelect">
      <option value="native">Native speaker</option>
      <option value="advanced">Advanced learner</option>
      <option value="beginner" selected>Beginner learner</option>
      <option value="learner">Learner</option>
    </select>
    <div id="joinErrorMsg" class="error-msg"></div>
    <div class="modal-actions">
      <button class="btn btn-primary-lime" id="confirmJoinBtn">Join conversation</button>
      <button class="btn btn-outline" id="closeJoinModalBtn">Cancel</button>
    </div>
  </div>
</div>

<div id="toastMessage" class="toast-msg" style="opacity: 0;"></div>

<script>
  // Placeholder for any additional inline functionality
  // All main app logic is handled by app.js
</script>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
